<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel — Arantes Barbershop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    :root {

      --black: #080808;

      --black-2: #0e0e0e;

      --card: #141414;

      --card-2: #191919;

      --border: #292929;

      --text: #ffffff;

      --muted: #8c8c8c;

      --muted-2: #b5b5b5;

      --blue: #0B1F3A;

      --blue-light: #163A63;

      --green: #25D366;

    }


    body {

      font-family: "Inter", sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(11, 31, 58, .22),
          transparent 35%
        ),
        var(--black);

      color: var(--text);

      min-height: 100vh;

    }


    button,
    input,
    select {

      font-family: inherit;

    }


    .hidden {

      display: none !important;

    }


    /* =================================
       LOGIN
    ================================= */

    .login-container {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 22px;

    }


    .login-box {

      width: 100%;

      max-width: 410px;

      background: rgba(20,20,20,.96);

      border: 1px solid var(--border);

      border-radius: 22px;

      padding: 34px 24px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.55);

    }


    .login-logo {

      width: 58px;

      height: 58px;

      border-radius: 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: var(--blue);

      color: white;

      font-family: "Oswald", sans-serif;

      font-size: 25px;

      font-weight: 700;

      margin-bottom: 18px;

      box-shadow:
        0 10px 30px rgba(11,31,58,.45);

    }


    .login-title {

      font-family: "Oswald", sans-serif;

      font-size: 32px;

      letter-spacing: 1px;

    }


    .login-subtitle {

      color: var(--muted);

      font-size: 13px;

      margin-top: 5px;

      margin-bottom: 30px;

    }


    label {

      display: block;

      color: var(--muted-2);

      font-size: 12px;

      font-weight: 600;

      margin-bottom: 7px;

    }


    input,
    select {

      width: 100%;

      background: #0b0b0b;

      color: white;

      border: 1px solid var(--border);

      border-radius: 11px;

      padding: 14px;

      outline: none;

      margin-bottom: 17px;

      font-size: 14px;

    }


    input:focus,
    select:focus {

      border-color: var(--blue-light);

    }


    .login-button {

      width: 100%;

      border: none;

      border-radius: 11px;

      padding: 15px;

      background: var(--blue);

      color: white;

      font-weight: 800;

      font-size: 14px;

      cursor: pointer;

      transition: .2s;

    }


    .login-button:active {

      transform: scale(.98);

    }


    .error {

      color: #ff7777;

      font-size: 13px;

      margin-top: 14px;

    }


    /* =================================
       CONTAINER
    ================================= */

    .container {

      width: 100%;

      max-width: 1200px;

      margin: 0 auto;

      padding: 22px 16px 45px;

    }


    /* =================================
       HEADER
    ================================= */

    header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 25px;

    }


    .brand {

      display: flex;

      align-items: center;

      gap: 12px;

    }


    .brand-icon {

      width: 46px;

      height: 46px;

      border-radius: 13px;

      background: var(--blue);

      display: flex;

      align-items: center;

      justify-content: center;

      font-family: "Oswald", sans-serif;

      font-weight: 700;

      font-size: 19px;

    }


    .header-title {

      font-family: "Oswald", sans-serif;

      font-size: 25px;

      letter-spacing: 1px;

      line-height: 1;

    }


    .header-title span {

      color: var(--muted);

      display: block;

      font-family: "Inter", sans-serif;

      font-size: 11px;

      letter-spacing: 0;

      margin-top: 5px;

    }


    .logout {

      border: 1px solid var(--border);

      background: #121212;

      color: white;

      padding: 10px 13px;

      border-radius: 10px;

      font-size: 12px;

      font-weight: 600;

      cursor: pointer;

    }


    /* =================================
       HERO
    ================================= */

    .hero {

      background:
        linear-gradient(
          135deg,
          #191919,
          #0f0f0f
        );

      border: 1px solid var(--border);

      border-radius: 18px;

      padding: 20px;

      margin-bottom: 16px;

      position: relative;

      overflow: hidden;

    }


    .hero::after {

      content: "";

      position: absolute;

      width: 150px;

      height: 150px;

      border-radius: 50%;

      background: rgba(11,31,58,.30);

      right: -60px;

      top: -70px;

    }


    .hero-small {

      color: var(--muted);

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 1.4px;

      margin-bottom: 7px;

    }


    .hero-title {

      font-family: "Oswald", sans-serif;

      font-size: 29px;

      letter-spacing: .5px;

    }


    .hero-date {

      color: var(--muted-2);

      font-size: 13px;

      margin-top: 5px;

    }


    /* =================================
       CARDS
    ================================= */

    .cards {

      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 10px;

      margin-bottom: 28px;

    }


    .card {

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 16px;

      padding: 16px;

      min-height: 105px;

      position: relative;

      overflow: hidden;

    }


    .card::before {

      content: "";

      position: absolute;

      left: 0;

      top: 0;

      width: 3px;

      height: 100%;

      background: var(--blue);

    }


    .card-title {

      color: var(--muted);

      font-size: 11px;

      font-weight: 600;

      margin-bottom: 11px;

    }


    .card-value {

      font-size: 24px;

      font-weight: 800;

      letter-spacing: -.5px;

    }


    /* =================================
       AGENDA HEADER
    ================================= */

    .section {

      margin-top: 24px;

    }


    .section-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

      margin-bottom: 15px;

      flex-wrap: wrap;

    }


    h2 {

      font-family: "Oswald", sans-serif;

      font-size: 25px;

      letter-spacing: .5px;

    }


    .section-subtitle {

      color: var(--muted);

      font-size: 11px;

      margin-top: 3px;

    }


    .section-filters {

      display: flex;

      gap: 8px;

      flex-wrap: wrap;

    }


    .date,
    .barber-filter {

      width: auto;

      min-width: 145px;

      background: var(--card);

      color: white;

      border: 1px solid var(--border);

      padding: 10px;

      border-radius: 10px;

      font-size: 12px;

      margin: 0;

    }


    /* =================================
       APPOINTMENT
    ================================= */

    .appointment {

      background:
        linear-gradient(
          145deg,
          #171717,
          #111111
        );

      border: 1px solid var(--border);

      border-radius: 17px;

      padding: 17px;

      margin-bottom: 11px;

      box-shadow:
        0 8px 25px rgba(0,0,0,.15);

    }


    .appointment-top {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 14px;

    }


    .time {

      font-family: "Oswald", sans-serif;

      font-size: 25px;

      color: white;

    }


    .status {

      font-size: 10px;

      font-weight: 700;

      padding: 6px 9px;

      border-radius: 20px;

      background: rgba(11,31,58,.35);

      color: #7da7d9;

      border: 1px solid rgba(22,58,99,.65);

    }


    .client {

      font-size: 17px;

      font-weight: 700;

      margin-bottom: 5px;

    }


    .service {

      color: var(--muted-2);

      font-size: 13px;

      margin-bottom: 4px;

    }


    .barber-tag {

      display: inline-block;

      color: #7da7d9;

      font-size: 12px;

      font-weight: 700;

      margin-bottom: 8px;

      padding: 4px 9px;

      border-radius: 20px;

      background: rgba(11,31,58,.35);

      border: 1px solid rgba(22,58,99,.55);

    }


    .price {

      color: white;

      margin-top: 11px;

      font-size: 15px;

      font-weight: 800;

    }


    /* =================================
       ACTIONS
    ================================= */

    .appointment-actions {

      display: flex;

      flex-direction: column;

      gap: 8px;

      margin-top: 16px;

    }


    .whatsapp-button {

      width: 100%;

      border: none;

      border-radius: 10px;

      padding: 12px;

      background: var(--green);

      color: white;

      font-weight: 800;

      font-size: 13px;

      cursor: pointer;

      text-align: center;

      text-decoration: none;

    }


    .cancel-button {

      width: 100%;

      border: 1px solid #252d38;

      border-radius: 10px;

      padding: 12px;

      background: #11151a;

      color: #8fb1d6;

      font-weight: 600;

      font-size: 13px;

      cursor: pointer;

    }


    .empty {

      background: var(--card);

      border: 1px dashed #333;

      border-radius: 16px;

      padding: 35px 18px;

      text-align: center;

      color: var(--muted);

      font-size: 13px;

    }


    /* =================================
       DESKTOP
    ================================= */

    @media (min-width: 700px) {

      .container {

        padding: 35px 30px 55px;

      }


      .cards {

        grid-template-columns:
          repeat(4, 1fr);

        gap: 12px;

      }


      .appointment-actions {

        flex-direction: row;

      }


      .whatsapp-button,
      .cancel-button {

        flex: 1;

      }

    }


  </style>

</head>


<body>


  <!-- =================================
       LOGIN
  ================================= -->

  <div
    id="loginContainer"
    class="login-container"
  >

    <div class="login-box">

      <div class="login-logo">
        A
      </div>

      <div class="login-title">
        ARANTES
      </div>

      <div class="login-subtitle">
        Painel administrativo
      </div>


      <form id="loginForm">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          placeholder="Seu e-mail"
          required
        >


        <label for="password">
          Senha
        </label>

        <input
          type="password"
          id="password"
          placeholder="Sua senha"
          required
        >


        <button
          type="submit"
          class="login-button"
        >
          ENTRAR NO PAINEL
        </button>


        <div
          id="loginError"
          class="error hidden"
        ></div>

      </form>

    </div>

  </div>


  <!-- =================================
       PAINEL
  ================================= -->

  <div
    id="adminPanel"
    class="hidden"
  >

    <div class="container">


      <!-- HEADER -->

      <header>

        <div class="brand">

          <div class="brand-icon">
            A
          </div>

          <div class="header-title">

            ARANTES

            <span>
              Painel administrativo
            </span>

          </div>

        </div>


        <button
          id="logoutButton"
          class="logout"
        >
          Sair
        </button>

      </header>


      <!-- HERO -->

      <div class="hero">

        <div class="hero-small">
          Gestão da barbearia
        </div>

        <div class="hero-title">
          Sua agenda, no controle.
        </div>

        <div
          id="heroDate"
          class="hero-date"
        >
          Hoje
        </div>

      </div>


      <!-- CARDS -->

      <section class="cards">


        <div class="card">

          <div class="card-title">
            AGENDAMENTOS
          </div>

          <div class="card-value">
            0
          </div>

        </div>


        <div class="card">

          <div class="card-title">
            CLIENTES
          </div>

          <div class="card-value">
            0
          </div>

        </div>


        <div class="card">

          <div class="card-title">
            VALOR PREVISTO
          </div>

          <div class="card-value">
            R$ 0,00
          </div>

        </div>


        <div class="card">

          <div class="card-title">
            PRÓXIMO HORÁRIO
          </div>

          <div class="card-value">
            —
          </div>

        </div>


      </section>


      <!-- AGENDA -->

      <section class="section">


        <div class="section-header">

          <div>

            <h2>
              Agenda
            </h2>

            <div class="section-subtitle">
              Agendamentos do dia selecionado
            </div>

          </div>


          <div class="section-filters">

            <select
              id="barberFilter"
              class="barber-filter"
            >
              <option value="">Todos os barbeiros</option>
            </select>

            <input
              type="date"
              id="dateFilter"
              class="date"
            >

          </div>

        </div>


        <div id="appointmentsList">

          <div class="empty">
            Nenhum agendamento carregado.
          </div>

        </div>


      </section>


    </div>

  </div>


  <script>


    /* =================================
       SUPABASE
    ================================= */

    const SUPABASE_URL =
      "https://bgmcryfcwjikuttwftgp.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_C0Tahq5Lffw4ukCwj9WXHQ_HtDbD6PU";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =================================
       ELEMENTOS
    ================================= */

    const loginContainer =
      document.getElementById(
        "loginContainer"
      );


    const adminPanel =
      document.getElementById(
        "adminPanel"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const loginError =
      document.getElementById(
        "loginError"
      );


    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    const dateFilter =
      document.getElementById(
        "dateFilter"
      );


    const barberFilter =
      document.getElementById(
        "barberFilter"
      );


    const heroDate =
      document.getElementById(
        "heroDate"
      );


    /* =================================
       DATA DE HOJE
    ================================= */

    function obterDataHoje() {

      const agora =
        new Date();


      return [

        agora.getFullYear(),

        String(
          agora.getMonth() + 1
        ).padStart(2, "0"),

        String(
          agora.getDate()
        ).padStart(2, "0")

      ].join("-");

    }


    /* =================================
       DATA FORMATADA
    ================================= */

    function formatarData(
      data
    ) {

      if (!data) {
        return "";
      }


      const partes =
        data.split("-");


      if (
        partes.length !== 3
      ) {

        return data;

      }


      return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
      );

    }


    /* =================================
       CARREGAR LISTA DE BARBEIROS (FILTRO)
    ================================= */

    async function carregarFiltroBarbeiros() {

      const {
        data: barbeiros,
        error
      } =
        await supabaseClient
          .from("barbeiros")
          .select("id, nome")
          .eq("ativo", true)
          .order("nome");


      if (error) {

        console.error(
          "Erro ao carregar barbeiros:",
          error
        );

        return;

      }


      (barbeiros || []).forEach(
        (barbeiro) => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            barbeiro.id;

          option.textContent =
            barbeiro.nome;

          barberFilter.appendChild(
            option
          );

        }
      );

    }


    /* =================================
       MOSTRAR PAINEL
    ================================= */

    function mostrarPainel() {

      loginContainer.classList.add(
        "hidden"
      );


      adminPanel.classList.remove(
        "hidden"
      );


      dateFilter.value =
        obterDataHoje();


      heroDate.textContent =
        "Hoje • " +
        formatarData(
          obterDataHoje()
        );


      carregarFiltroBarbeiros();

      carregarAgendamentos();

    }


    /* =================================
       MOSTRAR LOGIN
    ================================= */

    function mostrarLogin() {

      adminPanel.classList.add(
        "hidden"
      );


      loginContainer.classList.remove(
        "hidden"
      );

    }


    /* =================================
       LOGIN
    ================================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        loginError.classList.add(
          "hidden"
        );


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const {
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (error) {

          loginError.textContent =
            "E-mail ou senha incorretos.";


          loginError.classList.remove(
            "hidden"
          );


          return;

        }


        mostrarPainel();

      }
    );


    /* =================================
       LOGOUT
    ================================= */

    logoutButton.addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();


        mostrarLogin();

      }
    );


    /* =================================
       VERIFICAR SESSÃO
    ================================= */

    async function verificarSessao() {

      const {
        data
      } =
        await supabaseClient.auth
          .getSession();


      if (data.session) {

        mostrarPainel();

      } else {

        mostrarLogin();

      }

    }


    /* =================================
       CARREGAR AGENDAMENTOS
    ================================= */

    async function carregarAgendamentos(
      dataSelecionada = null
    ) {

      const agora =
        new Date();


      const hoje =
        obterDataHoje();


      const dataBusca =
        dataSelecionada || hoje;


      const barbeiroSelecionado =
        barberFilter.value;


      /* BUSCAR (inclui o nome do barbeiro pela relação com a
         tabela barbeiros) */

      let consulta =
        supabaseClient
          .from("agendamentos")
          .select(
            "id, nome, email, telefone, servico, preco, data, horario, criado_em, barbeiro_id, barbeiros(nome)"
          )
          .eq(
            "data",
            dataBusca
          );


      if (barbeiroSelecionado) {

        consulta =
          consulta.eq(
            "barbeiro_id",
            barbeiroSelecionado
          );

      }


      const {
        data: agendamentos,
        error
      } =
        await consulta.order(
          "horario",
          {
            ascending: true
          }
        );


      if (error) {

        console.error(
          "Erro ao carregar agendamentos:",
          error
        );


        return;

      }


      const lista =
        document.getElementById(
          "appointmentsList"
        );


      /* QUANTIDADE */

      const quantidade =
        agendamentos
          ? agendamentos.length
          : 0;


      /* FATURAMENTO */

      const faturamento =
        (agendamentos || [])
          .reduce(
            (
              total,
              agendamento
            ) => {

              return total +
                Number(
                  agendamento.preco || 0
                );

            },
            0
          );


      /* CLIENTES */

      const clientesUnicos =
        new Set(

          (agendamentos || [])
            .map(
              agendamento =>

                agendamento.telefone ||

                agendamento.email ||

                agendamento.nome

            )

        ).size;


      /* PRÓXIMO */

      let proximo = null;


      if (
        dataBusca === hoje
      ) {

        const horaAtual =
          agora
            .toTimeString()
            .slice(0, 5);


        proximo =
          (agendamentos || [])
            .find(
              agendamento =>

                agendamento.horario >=
                horaAtual

            );

      } else {

        if (
          agendamentos &&
          agendamentos.length > 0
        ) {

          proximo =
            agendamentos[0];

        }

      }


      /* ATUALIZAR CARDS */

      document.querySelector(
        ".card:nth-child(1) .card-value"
      ).textContent =
        quantidade;


      document.querySelector(
        ".card:nth-child(2) .card-value"
      ).textContent =
        clientesUnicos;


      document.querySelector(
        ".card:nth-child(3) .card-value"
      ).textContent =

        "R$ " +

        faturamento
          .toFixed(2)
          .replace(
            ".",
            ","
          );


      document.querySelector(
        ".card:nth-child(4) .card-value"
      ).textContent =

        proximo
          ? proximo.horario
          : "—";


      /* DATA DO HERO */

      if (
        dataBusca === hoje
      ) {

        heroDate.textContent =
          "Hoje • " +
          formatarData(
            dataBusca
          );

      } else {

        heroDate.textContent =
          "Data selecionada • " +
          formatarData(
            dataBusca
          );

      }


      /* SEM AGENDAMENTOS */

      if (
        !agendamentos ||
        agendamentos.length === 0
      ) {

        lista.innerHTML = `

          <div class="empty">

            Nenhum agendamento para esta data.

          </div>

        `;


        return;

      }


      /* LIMPAR */

      lista.innerHTML = "";


      /* MOSTRAR */

      agendamentos.forEach(
        (
          agendamento
        ) => {


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "appointment";


          /* TELEFONE */

          let telefone =
            agendamento.telefone || "";


          telefone =
            telefone.replace(
              /\D/g,
              ""
            );


          if (
            telefone.length === 10 ||
            telefone.length === 11
          ) {

            telefone =
              "55" +
              telefone;

          }


          /* MENSAGEM */

          const mensagem =
            encodeURIComponent(

              `Olá, ${agendamento.nome}! Aqui é da Arantes Barbershop. Estou entrando em contato sobre seu agendamento de ${agendamento.servico} às ${agendamento.horario}.`

            );


          const whatsappLink =
            telefone

              ?

              `https://wa.me/${telefone}?text=${mensagem}`

              :

              "#";


          /* NOME DO BARBEIRO */

          const nomeBarbeiro =
            agendamento.barbeiros

              ?

              agendamento.barbeiros.nome

              :

              "Barbeiro não definido";


          /* HTML */

          item.innerHTML = `

            <div class="appointment-top">

              <div class="time">
                ${agendamento.horario}
              </div>

              <div class="status">
                Confirmado
              </div>

            </div>


            <div class="barber-tag">
              ✂️ ${nomeBarbeiro}
            </div>


            <div class="client">
              ${agendamento.nome}
            </div>


            <div class="service">
              ${agendamento.servico}
            </div>


            <div class="service">
              ${
                agendamento.telefone ||
                "Telefone não informado"
              }
            </div>


            <div class="price">

              R$ ${
                Number(
                  agendamento.preco
                )
                .toFixed(2)
                .replace(
                  ".",
                  ","
                )
              }

            </div>


            <div class="appointment-actions">


              ${
                telefone

                ?

                `

                  <a
                    href="${whatsappLink}"
                    target="_blank"
                    class="whatsapp-button"
                  >
                    💬 Chamar no WhatsApp
                  </a>

                `

                :

                `

                  <button
                    class="whatsapp-button"
                    disabled
                    style="
                      opacity:.4;
                      cursor:not-allowed;
                    "
                  >
                    📵 Sem telefone
                  </button>

                `

              }


              <button
                class="cancel-button"
                onclick="cancelarAgendamento('${agendamento.id}')"
              >
                Cancelar agendamento
              </button>


            </div>

          `;


          lista.appendChild(
            item
          );


        }
      );

    }


    /* =================================
       CANCELAR AGENDAMENTO
    ================================= */

    async function cancelarAgendamento(
      id
    ) {

      const confirmar =
        confirm(
          "Tem certeza que deseja cancelar este agendamento?"
        );


      if (!confirmar) {

        return;

      }


      const {
        error
      } =
        await supabaseClient
          .from("agendamentos")
          .delete()
          .eq(
            "id",
            id
          );


      if (error) {

        console.error(
          "Erro ao cancelar agendamento:",
          error
        );


        alert(
          "Não foi possível cancelar o agendamento."
        );


        return;

      }


      alert(
        "Agendamento cancelado com sucesso!"
      );


      carregarAgendamentos(
        dateFilter.value
      );

    }


    /* =================================
       FILTROS
    ================================= */

    dateFilter.addEventListener(
      "change",
      function() {

        const dataSelecionada =
          this.value;


        if (
          dataSelecionada
        ) {

          carregarAgendamentos(
            dataSelecionada
          );

        }

      }
    );


    barberFilter.addEventListener(
      "change",
      function() {

        carregarAgendamentos(
          dateFilter.value
        );

      }
    );


    /* =================================
       INICIAR
    ================================= */

    verificarSessao();


  </script>
