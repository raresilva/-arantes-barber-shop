<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel — Arantes Barbershop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #0b0b0b;
      color: #fff;
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    /* ==========================
       LOGIN
    ========================== */

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #141414;
      border: 1px solid #252525;
      border-radius: 18px;
      padding: 28px 22px;
    }

    .logo {
      font-family: "Oswald", sans-serif;
      font-size: 30px;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      background: #0d0d0d;
      color: #fff;
      border: 1px solid #2c2c2c;
      border-radius: 10px;
      padding: 13px;
      outline: none;
      margin-bottom: 16px;
      font-size: 14px;
    }

    input:focus {
      border-color: #555;
    }

    .login-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #fff;
      color: #000;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .error {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 14px;
      line-height: 1.4;
    }

    /* ==========================
       PAINEL
    ========================== */

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .header-title {
      font-family: "Oswald", sans-serif;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .header-title span {
      color: #888;
      font-size: 13px;
      display: block;
      font-family: "Inter", sans-serif;
      letter-spacing: 0;
      margin-top: 3px;
    }

    .logout {
      border: 1px solid #2d2d2d;
      background: #151515;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    /* ==========================
       CARDS
    ========================== */

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .card {
      background: #141414;
      border: 1px solid #242424;
      border-radius: 14px;
      padding: 18px;
    }

    .card-title {
      color: #999;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 26px;
      font-weight: 700;
    }

    /* ==========================
       AGENDA
    ========================== */

    .section {
      margin-top: 26px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    h2 {
      font-family: "Oswald", sans-serif;
      font-size: 23px;
      letter-spacing: .5px;
    }

    .date {
      background: #141414;
      color: #fff;
      border: 1px solid #2d2d2d;
      padding: 10px;
      border-radius: 9px;
      font-size: 13px;
    }

    .appointment {
      background: #141414;
      border: 1px solid #242424;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
    }

    .appointment-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .time {
      font-size: 20px;
      font-weight: 700;
    }

    .status {
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 20px;
      background: #222;
      color: #ddd;
    }

    .client {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .service {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .price {
      margin-top: 12px;
      font-weight: 700;
      font-size: 15px;
    }

    /* ==========================
       BOTÕES DO AGENDAMENTO
    ========================== */

    .appointment-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }

    .whatsapp-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      background: #25D366;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .whatsapp-button:active {
      opacity: .85;
    }

    .cancel-button {
      width: 100%;
      border: 1px solid #3a2525;
      border-radius: 10px;
      padding: 12px;
      background: #181111;
      color: #ff6b6b;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .cancel-button:active {
      opacity: .8;
    }

    @media (min-width: 700px) {

      .cards {
        grid-template-columns: repeat(4, 1fr);
      }

      .container {
        padding: 35px 30px 50px;
      }

      .appointment-actions {
        flex-direction: row;
      }

      .whatsapp-button,
      .cancel-button {
        width: auto;
        flex: 1;
      }

    }

  </style>

</head>


<body>


  <!-- ==========================
       LOGIN
  ========================== -->

  <div
    id="loginContainer"
    class="login-container"
  >

    <div class="login-box">

      <div class="logo">
        ARANTES
      </div>

      <div class="subtitle">
        Painel administrativo
      </div>

      <form id="loginForm">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          placeholder="Seu e-mail"
          required
        >

        <label for="password">
          Senha
        </label>

        <input
          type="password"
          id="password"
          placeholder="Sua senha"
          required
        >

        <button
          type="submit"
          class="login-button"
        >
          Entrar
        </button>

        <div
          id="loginError"
          class="error hidden"
        ></div>

      </form>

    </div>

  </div>


  <!-- ==========================
       PAINEL
  ========================== -->

  <div
    id="adminPanel"
    class="hidden"
  >

    <div class="container">

      <header>

        <div class="header-title">

          ARANTES

          <span>
            Painel administrativo
          </span>

        </div>

        <button
          id="logoutButton"
          class="logout"
        >
          Sair
        </button>

      </header>


      <!-- ==========================
           CARDS
      ========================== -->

      <section class="cards">

        <div class="card">

          <div class="card-title">
            Agendamentos
          </div>

          <div class="card-value">
            0
          </div>

        </div>


        <div class="card">

          <div class="card-title">
            Clientes
          </div>

          <div class="card-value">
            0
          </div>

        </div>


        <div class="card">

          <div class="card-title">
            Valor previsto
          </div>

          <div class="card-value">
            R$ 0,00
          </div>

        </div>


        <div class="card">

          <div class="card-title">
            Próximo horário
          </div>

          <div class="card-value">
            —
          </div>

        </div>

      </section>


      <!-- ==========================
           AGENDA
      ========================== -->

      <section class="section">

        <div class="section-header">

          <h2>
            Agenda
          </h2>

          <input
            type="date"
            id="dateFilter"
            class="date"
          >

        </div>


        <div id="appointmentsList">

          <div
            style="
              background:#141414;
              border:1px dashed #303030;
              border-radius:14px;
              padding:28px 18px;
              text-align:center;
              color:#888;
              font-size:14px;
            "
          >
            Nenhum agendamento carregado.
          </div>

        </div>

      </section>

    </div>

  </div>


  <script>

    /* ==========================
       SUPABASE
    ========================== */

    const SUPABASE_URL =
      "https://bgmcryfcwjikuttwftgp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_C0Tahq5Lffw4ukCwj9WXHQ_HtDbD6PU";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ==========================
       ELEMENTOS
    ========================== */

    const loginContainer =
      document.getElementById(
        "loginContainer"
      );

    const adminPanel =
      document.getElementById(
        "adminPanel"
      );

    const loginForm =
      document.getElementById(
        "loginForm"
      );

    const loginError =
      document.getElementById(
        "loginError"
      );

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );

    const dateFilter =
      document.getElementById(
        "dateFilter"
      );


    /* ==========================
       DATA DE HOJE
    ========================== */

    function obterDataHoje() {

      const agora =
        new Date();

      return [

        agora.getFullYear(),

        String(
          agora.getMonth() + 1
        ).padStart(2, "0"),

        String(
          agora.getDate()
        ).padStart(2, "0")

      ].join("-");

    }


    /* ==========================
       MOSTRAR PAINEL
    ========================== */

    function mostrarPainel() {

      loginContainer.classList.add(
        "hidden"
      );

      adminPanel.classList.remove(
        "hidden"
      );

      dateFilter.value =
        obterDataHoje();

      carregarAgendamentos();

    }


    /* ==========================
       MOSTRAR LOGIN
    ========================== */

    function mostrarLogin() {

      adminPanel.classList.add(
        "hidden"
      );

      loginContainer.classList.remove(
        "hidden"
      );

    }


    /* ==========================
       LOGIN
    ========================== */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        loginError.classList.add(
          "hidden"
        );


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const {
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (error) {

          loginError.textContent =
            "E-mail ou senha incorretos.";

          loginError.classList.remove(
            "hidden"
          );

          return;

        }


        mostrarPainel();

      }
    );


    /* ==========================
       LOGOUT
    ========================== */

    logoutButton.addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        mostrarLogin();

      }
    );


    /* ==========================
       VERIFICAR SESSÃO
    ========================== */

    async function verificarSessao() {

      const {
        data
      } =
        await supabaseClient.auth
          .getSession();


      if (data.session) {

        mostrarPainel();

      } else {

        mostrarLogin();

      }

    }


    /* ==========================
       CARREGAR AGENDAMENTOS
    ========================== */

    async function carregarAgendamentos(
      dataSelecionada = null
    ) {

      const agora =
        new Date();


      const hoje =
        obterDataHoje();


      const dataBusca =
        dataSelecionada || hoje;


      /* ==========================
         BUSCAR NO SUPABASE
      ========================== */

      const {
        data: agendamentos,
        error
      } =
        await supabaseClient
          .from("agendamentos")
          .select(
            "id, nome, email, telefone, servico, preco, data, horario, criado_em"
          )
          .eq(
            "data",
            dataBusca
          )
          .order(
            "horario",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Erro ao carregar agendamentos:",
          error
        );

        return;

      }


      const lista =
        document.getElementById(
          "appointmentsList"
        );


      /* ==========================
         QUANTIDADE
      ========================== */

      const quantidade =
        agendamentos
          ? agendamentos.length
          : 0;


      /* ==========================
         FATURAMENTO
      ========================== */

      const faturamento =
        (agendamentos || [])
          .reduce(
            (
              total,
              agendamento
            ) => {

              return total +
                Number(
                  agendamento.preco || 0
                );

            },
            0
          );


      /* ==========================
         CLIENTES
      ========================== */

      const clientesUnicos =
        new Set(

          (agendamentos || [])
            .map(
              agendamento =>

                agendamento.telefone ||

                agendamento.email ||

                agendamento.nome

            )

        ).size;


      /* ==========================
         PRÓXIMO HORÁRIO
      ========================== */

      let proximo = null;


      if (dataBusca === hoje) {

        const horaAtual =
          agora
            .toTimeString()
            .slice(0, 5);


        proximo =
          (agendamentos || [])
            .find(
              agendamento =>

                agendamento.horario >=
                horaAtual

            );

      } else {

        if (
          agendamentos &&
          agendamentos.length > 0
        ) {

          proximo =
            agendamentos[0];

        }

      }


      /* ==========================
         ATUALIZAR CARDS
      ========================== */

      document.querySelector(
        ".card:nth-child(1) .card-value"
      ).textContent =
        quantidade;


      document.querySelector(
        ".card:nth-child(2) .card-value"
      ).textContent =
        clientesUnicos;


      document.querySelector(
        ".card:nth-child(3) .card-value"
      ).textContent =

        "R$ " +

        faturamento
          .toFixed(2)
          .replace(
            ".",
            ","
          );


      document.querySelector(
        ".card:nth-child(4) .card-value"
      ).textContent =

        proximo
          ? proximo.horario
          : "—";


      /* ==========================
         SEM AGENDAMENTOS
      ========================== */

      if (
        !agendamentos ||
        agendamentos.length === 0
      ) {

        lista.innerHTML = `

          <div style="
            background:#141414;
            border:1px dashed #303030;
            border-radius:14px;
            padding:28px 18px;
            text-align:center;
            color:#888;
            font-size:14px;
          ">

            Nenhum agendamento para esta data.

          </div>

        `;

        return;

      }


      /* ==========================
         LIMPAR LISTA
      ========================== */

      lista.innerHTML = "";


      /* ==========================
         MOSTRAR AGENDAMENTOS
      ========================== */

      agendamentos.forEach(
        (
          agendamento
        ) => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "appointment";


          /* ==========================
             WHATSAPP
          ========================== */

          let telefone =
            agendamento.telefone || "";


          telefone =
            telefone.replace(
              /\D/g,
              ""
            );


          /*
            Se o número tiver 10 ou 11 dígitos,
            adicionamos o código do Brasil.
          */

          if (
            telefone.length === 10 ||
            telefone.length === 11
          ) {

            telefone =
              "55" +
              telefone;

          }


          const mensagem =
            encodeURIComponent(
              `Olá, ${agendamento.nome}! Aqui é da Arantes Barbershop. Estou entrando em contato sobre seu agendamento de ${agendamento.servico} às ${agendamento.horario}.`
            );


          const whatsappLink =
            telefone
              ? `https://wa.me/${telefone}?text=${mensagem}`
              : "#";


          /* ==========================
             HTML DO AGENDAMENTO
          ========================== */

          item.innerHTML = `

            <div class="appointment-top">

              <div class="time">
                ${agendamento.horario}
              </div>

              <div class="status">
                Confirmado
              </div>

            </div>


            <div class="client">
              ${agendamento.nome}
            </div>


            <div class="service">
              ${agendamento.servico}
            </div>


            <div class="service">
              ${
                agendamento.telefone ||
                "Telefone não informado"
              }
            </div>


            <div class="price">
              R$ ${
                Number(
                  agendamento.preco
                )
                .toFixed(2)
                .replace(
                  ".",
                  ","
                )
              }
            </div>


            <div class="appointment-actions">

              ${
                telefone
                ?

                `
                  <a
                    href="${whatsappLink}"
                    target="_blank"
                    class="whatsapp-button"
                  >
                    💬 Chamar no WhatsApp
                  </a>
                `

                :

                `
                  <button
                    class="whatsapp-button"
                    disabled
                    style="
                      opacity:.4;
                      cursor:not-allowed;
                    "
                  >
                    📵 Sem telefone
                  </button>
                `
              }


              <button
                class="cancel-button"
                onclick="cancelarAgendamento('${agendamento.id}')"
              >
                Cancelar agendamento
              </button>

            </div>

          `;


          lista.appendChild(
            item
          );

        }
      );

    }


    /* ==========================
       CANCELAR AGENDAMENTO
    ========================== */

    async function cancelarAgendamento(
      id
    ) {

      const confirmar =
        confirm(
          "Tem certeza que deseja cancelar este agendamento?"
        );


      if (!confirmar) {

        return;

      }


      const {
        error
      } =
        await supabaseClient
          .from("agendamentos")
          .delete()
          .eq(
            "id",
            id
          );


      if (error) {

        console.error(
          "Erro ao cancelar agendamento:",
          error
        );

        alert(
          "Não foi possível cancelar o agendamento."
        );

        return;

      }


      alert(
        "Agendamento cancelado com sucesso!"
      );


      carregarAgendamentos(
        dateFilter.value
      );

    }


    /* ==========================
       FILTRO DE DATA
    ========================== */

    dateFilter.addEventListener(
      "change",
      function() {

        const dataSelecionada =
          this.value;


        if (
          dataSelecionada
        ) {

          carregarAgendamentos(
            dataSelecionada
          );

        }

      }
    );


    /* ==========================
       INICIAR SISTEMA
    ========================== */

    verificarSessao();

  </script>

</body>

</html>
